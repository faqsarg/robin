services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: robin
      POSTGRES_USER: robin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U robin"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      args:
        VERSION: local-dev
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: robin
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: robin
      DB_SSLMODE: disable
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    environment:
      BACKEND_HOST: backend:8080
    depends_on:
      - backend
    ports:
      - "3000:8080"

volumes:
  pgdata:
